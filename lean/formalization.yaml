classification:
  arxiv: ["math.GR", "math.NT"]
  msc2020: ["20B30", "20D60", "11P32", "05A05"]

status:
  scope: >-
    Whole-paper formalization: every proposition, lemma and theorem of the
    paper's proof (sections 2-8) is formalized and proved, with the eight
    classical inputs stated as named propositions and taken as hypotheses.
    The only deliberately unformalized step is Corollary 8.2's classical
    fact that theta(n) < n for infinitely many n, so the optimality
    *interpretation* (constant 1 unattainable) rests on that unformalized
    classical fact, while the construction itself (not_universal, L_eq_theta)
    is fully machine-checked.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
    - "UniversalWords.rs_window_mass (Unconditional.lean only)"
    - "UniversalWords.hkl (Unconditional.lean only)"
    - "UniversalWords.boccara_three (Unconditional.lean only)"
    - "UniversalWords.pi_upper (Unconditional.lean only)"
    - "UniversalWords.pi_lower (Unconditional.lean only)"
    - "UniversalWords.brun_titchmarsh (Unconditional.lean only)"
    - "UniversalWords.vinogradov (Unconditional.lean only)"
    - "UniversalWords.sieve_r2 (Unconditional.lean only)"
  main_results:
    - declaration: "UniversalWords.kourovka_10_32_conditional"
      file: "UniversalWords/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies:
        - statement: "RSWindowMassStatement (hypothesis of the implication)"
          source: "Rosser-Schoenfeld 1962, Theorem 9; Rosser-Schoenfeld 1975, Corollary to Theorem 6"
        - statement: "HKLStatement (hypothesis of the implication)"
          source: "Herzog-Kaplan-Lev 2004, Theorem 7"
        - statement: "BoccaraStatement (hypothesis of the implication)"
          source: "Boccara 1982"
        - statement: "PiUpperStatement, PiLowerStatement (hypotheses of the implication)"
          source: "Rosser-Schoenfeld 1962, eqs. (3.6), (3.5)"
        - statement: "BrunTitchmarshStatement (hypothesis of the implication)"
          source: "Montgomery-Vaughan 1973, Theorem 2"
        - statement: "VinogradovStatement (hypothesis of the implication)"
          source: "Vinogradov 1937; Vaughan, The Hardy-Littlewood Method, 2nd ed., Theorem 3.4"
        - statement: "SieveR2Statement (hypothesis of the implication)"
          source: "Halberstam-Richert 1974, Theorem 3.11"
    - declaration: "UniversalWords.not_universal"
      file: "UniversalWords/LowerBound.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "UniversalWords.kourovka_10_32"
      file: "UniversalWords/Unconditional.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
        - "UniversalWords.rs_window_mass"
        - "UniversalWords.hkl"
        - "UniversalWords.boccara_three"
        - "UniversalWords.pi_upper"
        - "UniversalWords.pi_lower"
        - "UniversalWords.brun_titchmarsh"
        - "UniversalWords.vinogradov"
        - "UniversalWords.sieve_r2"
      literature_dependencies:
        - statement: "The eight classical statements above, assumed as axioms"
          source: "See the source entries for each; documented on each axiom in UniversalWords/Unconditional.lean"

automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5", "claude-opus-5"]
      framework: "Claude Code"
      tool_setup: >-
        Interactive agentic sessions in the Claude Code CLI. Lean 4 with
        Mathlib (pinned via lake-manifest.json); iteration through an
        incremental file checker and full `lake build`; axiom auditing via
        `#print axioms` commands committed in UniversalWords.lean.
      prompting_notes: >-
        Goal-directed prompting by the author: the agent produced the
        mathematical proof (the accompanying paper) and its Lean
        formalization, ran adversarial referee rounds on the paper, and
        restructured the development so the main theorem is a fully proved
        implication; the author set goals, made acceptance decisions, and
        reviewed outcomes.
  notes: >-
    Both the mathematics (the proof presented in the accompanying paper) and
    the Lean formalization were produced by the agent under the author's
    direction. No claim in this file has been verified by an independent
    human mathematician.

fidelity:
  divergences: >-
    The eight classical inputs are stated in the specialised forms the proof
    uses rather than full generality: Rosser-Schoenfeld as a single window-
    mass bound and two pi(x) bounds; Boccara specialised to cycle type
    (q1,q2,q3,1) against a full cycle; Vinogradov in count form with an
    ineffective threshold; Halberstam-Richert with the constant absorbing
    the twin-prime constant. The formal constants (C, N0) are constructed
    from the hypotheses' existential constants rather than being the paper's
    numerically optimised C = 4.65, so the formal theorem asserts existence
    of effective constants rather than that particular value. Corollary 8.2's
    appeal to theta(n) < n infinitely often is not formalized.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude (adversarial referee rounds by the same agent family that produced the work)"
  notes: >-
    The paper underwent six adversarial referee rounds plus a communication
    audit, all performed by the producing agent (not independent). The Lean
    development is checked by `lake build` at the pinned toolchain and
    Mathlib revision; the axiom audit in UniversalWords.lean certifies the
    dependency sets stated above. No independent human peer review has taken
    place.

alignment:
  namespace: "UniversalWords"
  statements:
    - source: "Lemma 2.1 (parity and cycle bookkeeping)"
      lean: "UniversalWords.sign_eq_neg_one_pow_delta, UniversalWords.md_le_two_mul_delta"
      module: "UniversalWords/Basic.lean"
      status: "proved"
    - source: "Lemma 2.2 (root lemma)"
      lean: "UniversalWords.exists_zpow_eq_of_coprime, UniversalWords.word_of_factorization"
      module: "UniversalWords/Basic.lean"
      status: "proved"
    - source: "Lemma 2.3 (prime windows avoiding rs)"
      lean: "UniversalWords.exists_prime_window_coprime"
      module: "UniversalWords/Windows.lean"
      status: "proved"
    - source: "Proposition 4.1 (even targets)"
      lean: "UniversalWords.even_case"
      module: "UniversalWords/Cases.lean"
      status: "proved"
    - source: "Proposition 5.1 (odd targets of dense support)"
      lean: "UniversalWords.dense_case"
      module: "UniversalWords/Dense.lean"
      status: "proved"
    - source: "Lemma 6.2 (odd targets of sparse support)"
      lean: "UniversalWords.sparse_case"
      module: "UniversalWords/Cases.lean"
      status: "proved"
    - source: "Lemma 6.4 (singular-series average)"
      lean: "UniversalWords.averaging"
      module: "UniversalWords/Averaging.lean"
      status: "proved"
    - source: "Proposition 6.5 (existence of a good prime)"
      lean: "UniversalWords.exists_good_prime"
      module: "UniversalWords/GoodPrime.lean"
      status: "proved"
    - source: "Main Theorem (sections 3 and 7)"
      lean: "UniversalWords.kourovka_10_32_conditional"
      module: "UniversalWords/Main.lean"
      status: "proved"
      note: "As a fully proved implication from the eight classical statements."
    - source: "Main Theorem, unconditional form"
      lean: "UniversalWords.kourovka_10_32"
      module: "UniversalWords/Unconditional.lean"
      status: "literature-dependency"
      note: "The conditional theorem applied to the eight statements assumed as axioms."
    - source: "Proposition 8.1 (optimality construction)"
      lean: "UniversalWords.not_universal, UniversalWords.L_eq_theta"
      module: "UniversalWords/LowerBound.lean"
      status: "proved"
    - source: "Corollary 8.2 (constant 1 unattainable)"
      lean: ""
      module: ""
      status: "not-formalized"
      note: "Uses theta(n) < n infinitely often, which is not formalized."

acknowledgements: >-
  Built on Mathlib (the Lean mathematical library). The Challenge/Solution
